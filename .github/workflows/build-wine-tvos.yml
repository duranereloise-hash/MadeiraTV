name: Build Wine unix for tvOS (Phase 2, step 2)

on:
  workflow_dispatch:

jobs:
  wine-tvos:
    name: Configure + build Wine unix libs for tvOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch wine submodule
        run: |
          # Clone MadeiraTV's patched wine fork directly (tvOS fixes live there).
          git clone --depth 1 --branch madeira-lgpl \
            https://github.com/duranereloise-hash/wine.git wine 2>&1 | tail -3
          git -C wine log --oneline -1

      - name: Cache wine build trees + tvOS toolchains
        # ml1179: restore wine's configure-once trees and the toolchain outputs
        # so an unchanged-wine run skips configure / widl-gen / toolchain build.
        # Keyed on the wine fork HEAD + the MadeiraTV C-source hashes.
        uses: actions/cache@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
            toolchains/gnutls-tvos
            toolchains/ffmpeg-tvos
            toolchains/freetype-tvos
          key: wine-tvos-${{ hashFiles('wine/.git/HEAD') }}-${{ hashFiles('build/ntdll-unix/**', 'build/wineserver/**', 'build/win32u-unix/**', 'build/wine-pe/**') }}
          restore-keys: |
            wine-tvos-${{ hashFiles('wine/.git/HEAD') }}-
            wine-tvos-

      - name: Set up ccache
        # ml1179: intercept `xcrun -sdk <iphoneos|appletvos> clang` with ccache so
        # recompiling the ~100 unix objects after a 1-file change is near-zero.
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          brew install ccache 2>&1 | tail -3 || true
          mkdir -p "$GITHUB_WORKSPACE/.ccache/shims"
          # Shim xcrun (rewrites --sdk iphoneos->appletvos too so one pool is shared).
          cat > "$GITHUB_WORKSPACE/.ccache/shims/xcrun" <<'EOF'
          #!/bin/bash
          NEW=()
          PREV=""
          for a in "$@"; do
            if [ "$PREV" = "--sdk" ] && [ "$a" = "iphoneos" ]; then NEW+=("appletvos"); else NEW+=("$a"); fi
            PREV="$a"
          done
          if [[ " $* " == *" clang "* || " $* " == *clang++* || " $* " == *"--find clang"* ]]; then
            exec ccache /usr/bin/xcrun "${NEW[@]}"
          fi
          exec /usr/bin/xcrun "${NEW[@]}"
          EOF
          # Bare compiler shims for any direct invocation.
          for t in clang clang++ cc c++; do
            cat > "$GITHUB_WORKSPACE/.ccache/shims/$t" <<EOT
          #!/bin/bash
          SDK=\$(xcrun --sdk appletvos --show-sdk-path 2>/dev/null || xcrun --sdk iphoneos --show-sdk-path)
          exec ccache \$(which clang) -isysroot "\$SDK" "\$@"
          EOT
          done
          chmod +x "$GITHUB_WORKSPACE/.ccache/shims/"*
          echo "$GITHUB_WORKSPACE/.ccache/shims" >> $GITHUB_PATH
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache --max-size=2G
          ccache -z

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: wine-ccache-${{ hashFiles('wine/.git/HEAD') }}-${{ hashFiles('build/ntdll-unix/**', 'build/wineserver/**', 'build/win32u-unix/**', 'build/wine-pe/**') }}
          restore-keys: |
            wine-ccache-

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          python3 --version
          brew install bison flex 2>&1 | tail -3
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Download llvm-mingw (PE cross compiler for aarch64)
        run: |
          set -e
          mkdir -p toolchains
          cd toolchains
          curl -sSL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          tar -xJf llvm-mingw.tar.xz
          ls -d llvm-mingw-*/
          echo "$(pwd)/llvm-mingw-20260421-ucrt-macos-universal/bin" >> $GITHUB_PATH

      - name: Configure wine build-macos (HOST build for tools/config.h)
        run: |
          set -o pipefail
          ROOT="$(pwd)"
          cd wine
          # Wine's generated Makefiles reference ../../../../build/madeira_cfg.h
          # from build-macos/dlls/*/ (i.e. $ROOT/wine/build). Make it resolve
          # to the repo-root build/ via an absolute symlink.
          ln -sfn "$ROOT/build" "$ROOT/wine/build"
          ls -la "$ROOT/wine/build/madeira_cfg.h" || echo "SYMLINK TARGET MISSING"
          mkdir -p build-macos
          cd build-macos
          if [ ! -f config.status ]; then
            ../configure --without-x --without-freetype --without-fontconfig \
              --without-vulkan --without-opengl \
              --enable-wineandroid=no 2>&1 | tee ../../wine-build-macos-config.log
            echo "=== configure rc=${PIPESTATUS[0]} ==="
          fi
          ls include/config.h >/dev/null && echo "config.h OK" || echo "NO config.h"
          ls tools/winebuild/winebuild >/dev/null && echo "winebuild OK" || echo "winebuild not built yet"

      - name: Generate tools
        run: |
          set -o pipefail
          cd wine/build-macos
          make tools/winebuild/winebuild tools/widl/widl 2>&1 | tail -20
          ls -la tools/winebuild/winebuild tools/widl/widl 2>/dev/null || echo "tools missing"

      - name: Configure wine build-arm64ec (PE headers for winegstreamer)
        run: |
          set -o pipefail
          cd wine
          export PATH="$PWD/../toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          mkdir -p build-arm64ec
          cd build-arm64ec
          if [ ! -f config.status ]; then
            ../configure --enable-archs=arm64ec --without-x --disable-tests --without-freetype --without-vulkan --without-opengl 2>&1 | tail -20
          fi
          # widl-generated headers (wtypes.h, dwrite.h, objidlbase.h, ...)
          # are produced by building the include dir.
          make -C include 2>&1 | tail -8 || true
          ls include/wtypes.h include/dwrite.h include/objidlbase.h >/dev/null 2>&1 && echo "widl headers OK" || echo "some widl headers missing"

      - name: Build GnuTLS stack for tvOS
        run: |
          set -o pipefail
          chmod +x build/gnutls-ios/build-tvos.sh
          bash build/gnutls-ios/build-tvos.sh > build/gnutls-tvos.log 2>&1 || { tail -30 build/gnutls-tvos.log; exit 1; }
          echo "gnutls ok"

      - name: Build freetype for tvOS
        run: |
          set -o pipefail
          chmod +x build/freetype-ios/build-tvos.sh
          bash build/freetype-ios/build-tvos.sh > build/freetype-tvos.log 2>&1 || { tail -30 build/freetype-tvos.log; exit 1; }
          echo "freetype ok"

      - name: Build FFmpeg for tvOS
        run: |
          set -o pipefail
          chmod +x build/ffmpeg/build-tvos.sh
          bash build/ffmpeg/build-tvos.sh > build/ffmpeg-tvos.log 2>&1 || { tail -30 build/ffmpeg-tvos.log; exit 1; }
          echo "ffmpeg ok"

      - name: Build ntdll-unix for tvOS
        run: |
          set -o pipefail
          mkdir -p build
          chmod +x build/ntdll-unix/build.sh build/crypto-unix/gen_gnutls_symtab.sh 2>/dev/null || true
          chmod +x build/*/build.sh 2>/dev/null || true
          # Patch the build script in place (BSD sed needs `-i ''`):
          sed -i '' \
            -e 's|xcrun --sdk iphoneos|xcrun --sdk appletvos|g' \
            -e 's|-miphoneos-version-min=17.0|-mtvos-version-min=17.0|g' \
            -e 's|-miphoneos-version-min=| -mtvos-version-min=|g' \
            -e 's|toolchains/gnutls-ios|toolchains/gnutls-tvos|g' \
            -e 's|toolchains/ffmpeg-ios|toolchains/ffmpeg-tvos|g' \
            -e 's|research/freetype/include|toolchains/freetype-tvos/include/freetype2|g' \
            -e 's|-I"\$FFMPEG_PREFIX/include"|-I"$FFMPEG_PREFIX/include" -I"$REPO_ROOT/wine/build-arm64ec/include"|g' \
            build/ntdll-unix/build.sh
          bash build/ntdll-unix/build.sh 2>&1 | tee build/ntdll-unix-tvos.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Build wineserver for tvOS
        run: |
          set -o pipefail
          chmod +x build/wineserver/build-tvos-full.sh
          bash build/wineserver/build-tvos-full.sh 2>&1 | tee build/wineserver-tvos.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Build win32u-unix for tvOS
        run: |
          set -o pipefail
          chmod +x build/win32u-unix/build-tvos.sh
          # expose freetype prefix under the same layout win32u expects
          bash build/win32u-unix/build-tvos.sh 2>&1 | tee build/win32u-tvos.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Build Wine PE (ARM64EC) ntdll.dll
        run: |
          set -o pipefail
          chmod +x build/wine-pe/build-ntdll.sh
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          # Prereq: the PE-side support libs winegcc links against.
          cd wine/build-arm64ec
          make -C libs/winecrt0 2>&1 | tail -15
          make -C libs/musl 2>&1 | tail -5
          make -C libs/compiler-rt 2>&1 | tail -5
          ls -la libs/winecrt0/arm64ec-windows/libwinecrt0.a 2>/dev/null || echo "MISSING libwinecrt0.a"
          ls -la libs/musl/arm64ec-windows/libmusl.a 2>/dev/null || echo "MISSING libmusl.a"
          cd "$OLDPWD"
          mkdir -p app/Madeira/arm64ec-windows
          bash build/wine-pe/build-ntdll.sh 2>&1 | tee build/wine-pe-ntdll.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Build Wine PE - core DLLs
        run: |
          set -o pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          cd wine/build-arm64ec
          mkdir -p "$OLDPWD/app/Madeira/arm64ec-windows"
          for dll in kernelbase kernel32 user32 gdi32 advapi32 ws2_32 ntdll wow64; do
            echo "=== $dll ==="
            make -C dlls/$dll 2>&1 | tail -3
            f="dlls/$dll/arm64ec-windows/$dll.dll"
            if [ -f "$f" ]; then cp "$f" "$OLDPWD/app/Madeira/arm64ec-windows/$dll.dll"; echo "staged $dll.dll"; fi
          done
          ls -la "$OLDPWD/app/Madeira/arm64ec-windows/" | head -20

      - name: Upload ntdll-unix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-tvos-ntdll-unix-artifacts
          path: |
            build/ntdll-unix/obj/*.a
            build/ntdll-unix/obj/*.err
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/arm64ec-windows/*.dll
            build/wine-pe-ntdll.log
            build/wineserver/obj-tvos/*.err
            build/wineserver-tvos.log
            build/win32u-unix/obj-tvos/*.err
            build/win32u-tvos.log
            build/ntdll-unix-tvos.log
            toolchains/freetype-tvos/lib/*
            build/freetype-tvos.log
          if-no-files-found: warn
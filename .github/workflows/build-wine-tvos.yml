name: Build Wine unix for tvOS (Phase 2, step 2)

on:
  workflow_dispatch:

jobs:
  wine-tvos:
    name: Configure + build Wine unix libs for tvOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          submodule-depth: 1

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          python3 --version

      - name: Configure wine build-macos (HOST build for tools/config.h)
        run: |
          set -o pipefail
          cd wine
          mkdir -p build-macos
          cd build-macos
          if [ ! -f config.status ]; then
            ../configure --without-x --without-freetype --without-fontconfig \
              --without-vulkan --without-opengl \
              --enable-wineandroid=no 2>&1 | tee ../../wine-build-macos-config.log
            echo "=== configure rc=${PIPESTATUS[0]} ==="
          fi
          ls include/config.h >/dev/null && echo "config.h OK"
          ls tools/winebuild/winebuild >/dev/null && echo "winebuild OK" || echo "winebuild not built yet"

      - name: Generate tools
        run: |
          set -o pipefail
          cd wine/build-macos
          make tools/winebuild/winebuild tools/widl/widl 2>&1 | tail -20
          ls -la tools/winebuild/winebuild tools/widl/widl 2>/dev/null || echo "tools missing"

      - name: Build ntdll-unix for tvOS
        run: |
          set -o pipefail
          mkdir -p build
          # Patch the build script: iphoneos -> appletvos, miphoneos-version-min -> mtvos-version-min
          sed -i.bak \
            -e 's|xcrun --sdk iphoneos|xcrun --sdk appletvos|g' \
            -e 's|-miphoneos-version-min=17.0|-mtvos-version-min=17.0|g' \
            -e 's|-miphoneos-version-min=| -mtvos-version-min=|g' \
            build/ntdll-unix/build.sh
          bash build/ntdll-unix/build.sh 2>&1 | tee build/ntdll-unix-tvos.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Upload ntdll-unix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-tvos-ntdll-unix-artifacts
          path: |
            build/ntdll-unix/obj/*.a
            app/Madeira/libntdll_unix.a
            build/ntdll-unix-tvos.log
          if-no-files-found: warn
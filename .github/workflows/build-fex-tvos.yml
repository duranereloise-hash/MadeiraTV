name: Build FEX for tvOS (Phase 2, step 1)

on:
  workflow_dispatch:

jobs:
  fex-tvos:
    name: Build FEXCore static libs for tvOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          submodule-depth: 1

      - name: Show environment
        run: |
          xcodebuild -version
          cmake --version | head -2
          xcrun --sdk appletvos --show-sdk-version
          pip3 install --quiet packaging setuptools 2>&1 | tail -2 || true

      - name: FEX build-ios for tvOS
        run: |
          set -o pipefail
          mkdir -p build
          R="$(pwd)"
          B="$R/FEX/build-ios"
          CC_BIN="$(xcrun --sdk appletvos --find clang)"
          CXX_BIN="$(xcrun --sdk appletvos --find clang++)"
          echo "CC=$CC_BIN"
          echo "CXX=$CXX_BIN"
          # Detect whether CMake accepts iOS system name + tvOS sysroot
          cmake -S "$R/FEX" -B "$B" \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DFEX_IOS_HOST_BUILD=ON \
            -DTUNE_CPU=none \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST" \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_ASSERTIONS=OFF -DENABLE_CLANG_THUNKS=ON \
            -DENABLE_CCACHE=ON 2>&1 | tee build/fex-config.log

      - name: Build FEXCore
        run: |
          set -o pipefail
          cmake --build "build/../FEX/build-ios" --target FEXCore FEXCore_Base 2>&1 | tee build/fex-build.log

      - name: Show output
        if: always()
        run: |
          ls -la FEX/build-ios/FEXCore/Source/*.a 2>/dev/null || echo "no .a produced"
          find FEX/build-ios/External -name "*.a" 2>/dev/null | head -20
          tail -40 build/fex-config.log build/fex-build.log 2>/dev/null

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-tvos-build-artifacts
          path: |
            FEX/build-ios/FEXCore/Source/*.a
            FEX/build-ios/External/*/*.a
            FEX/build-ios/External/*/cmake_unofficial/*.a
            build/fex-config.log
            build/fex-build.log
          if-no-files-found: warn
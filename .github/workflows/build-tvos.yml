name: Build tvOS (Phase 1)

on:
  workflow_dispatch:

jobs:
  build-tvos:
    name: Build MadeiraTV.app for tvOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version 2>/dev/null || echo "no tvos sdk visible"

      - name: List available SDKs
        run: xcodebuild -showsdks

      - name: Build (tvOS Simulator, debug)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/MadeiraTV.xcodeproj \
            -scheme MadeiraTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/DerivedDataTV \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee build/tvos-build-sim.log

      - name: Build (tvOS device, no signing)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/MadeiraTV.xcodeproj \
            -scheme MadeiraTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/DerivedDataTV \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee build/tvos-build-dev.log

      - name: Verify products
        run: |
          find build/DerivedDataTV/Build/Products -name "*.app" -maxdepth 5
          echo "--- sizes ---"
          du -sh build/DerivedDataTV/Build/Products/*/MadeiraTV.app 2>/dev/null || true

      - name: Upload app bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadeiraTV-app-tvos
          path: |
            build/DerivedDataTV/Build/Products/Debug-appletvsimulator/MadeiraTV.app
            build/DerivedDataTV/Build/Products/Debug-appletvos/MadeiraTV.app
            build/tvos-build-sim.log
            build/tvos-build-dev.log
          if-no-files-found: warn
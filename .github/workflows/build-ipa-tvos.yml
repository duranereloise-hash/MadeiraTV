name: Build MadeiraTV IPA (link everything for tvOS)

on:
  workflow_dispatch:
    inputs:
      artefact_run:
        description: 'Pin to a specific successful run id of this workflow (blank = latest successful)'
        required: false
        type: string
  # ml1179: swift-only lane — a push touching only the app UI re-links the IPA
  # against the last-good component artifacts (~2 min) instead of rebuilding Wine.
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-ipa-tvos.yml'

jobs:
  link-ipa:
    name: Assemble libs + build .app/.ipa for tvOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch FEX submodule (headers for FEXBridge.mm)
        run: |
          git submodule init FEX
          git -c protocol.version=2 submodule update --init --depth 1 FEX
          git -C FEX log --oneline -1
          # FEXBridge.mm pulls FEXCore headers that include <fmt/format.h>
          git -C FEX submodule update --init --depth 1 External/fmt External/range-v3 External/unordered_dense 2>&1 | tail -5 || true
          ls FEX/FEXCore/include/FEXCore/Utils/Allocator.h && echo "FEX headers OK"
          ls FEX/External/fmt/include/fmt/format.h && echo "fmt headers OK"

      - name: Download latest artifacts from component workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p downloads

          fetch_artifact() { # workflow_file  artifact_name  out_dir
            wf="$1"; want="$2"; out="$3"
            PIN="${{ github.event.inputs.artefact_run }}"
            if [ -n "$PIN" ]; then
              run_id="$PIN"
              meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '{wf: .workflow_id, ok: (.conclusion == "success"), url: .html_url}')
              this_wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-ipa-tvos.yml" --jq '.id')
              if [ "$(echo "$meta" | jq -r .wf)" != "$this_wf" ] || [ "$(echo "$meta" | jq -r .ok)" != "true" ]; then
                echo "artefact_run=$PIN is not a successful run of build-ipa-tvos.yml"; return 1
              fi
              echo "== pinned $wf run=$run_id =="
            else
              # Latest successful run of the component workflow, sorted by
              # updated_at (a recently re-run workflow must win over an older
              # first-shard run).
              run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.conclusion=="success" and .status=="completed")] | sort_by(.updated_at) | reverse | .[0].id')
              [ -n "$run_id" ] || { echo "no successful run for $wf"; return 1; }
              echo "== $wf run=$run_id =="
            fi
            arts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name==\"$want\") | .id" | head -1)
            [ -n "$arts" ] || { echo "no artifact $want in $wf"; return 1; }
            mkdir -p "$out"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$arts/zip" > "$out/pkg.zip"
            (cd "$out" && unzip -o -q pkg.zip && rm -f pkg.zip)
          }

          fetch_artifact build-fex-tvos.yml fex-tvos-build-artifacts downloads/fex || true
          fetch_artifact build-wine-tvos.yml wine-tvos-ntdll-unix-artifacts downloads/wine || true
          fetch_artifact build-dxmt-tvos.yml dxmt-tvos downloads/dxmt || true
          fetch_artifact build-toolchains-tvos.yml toolchains-tvos downloads/toolchains || true
          echo "=== downloaded ==="
          find downloads -type f | head -40

      - name: Stage libraries into app/Madeira
        run: |
          set +e
          mkdir -p app/Madeira/arm64ec-windows
          # wine unix libs
          find downloads/wine -name "libntdll_unix.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/wine -name "libwineserver.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/wine -name "libwin32u_unix.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          # PE DLLs
          find downloads/wine -name "*.dll" -exec cp {} app/Madeira/arm64ec-windows/ \; 2>/dev/null || true
          # FEX
          find downloads/fex -name "libFEXCore*.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/fex -name "libJemallocLibs.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/fex -name "libfmt.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/fex -name "libcephes_128bit.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/fex -name "libxxhash.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/fex -name "libsoftfloat_3e.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          # DXMT combined
          find downloads/dxmt -name "libdxmt_combined_tvos.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/dxmt -name "libllvm_tvos.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/dxmt -name "libdxmt_unix_tvos.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          # GnuTLS/FFmpeg from toolchains artifact
          find downloads/toolchains -name "libgnutls.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libhogweed.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libnettle.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libgmp.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libavformat.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libavcodec.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libswresample.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          find downloads/toolchains -name "libavutil.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          # FreeType from the wine artifact (built by build-wine-tvos)
          find downloads/wine -name "libfreetype.a" -exec cp {} app/Madeira/ \; 2>/dev/null || true
          echo "=== staged app/Madeira ==="
          ls -la app/Madeira/*.a 2>/dev/null || echo "no .a staged"
          ls app/Madeira/arm64ec-windows/ 2>/dev/null | head -20

      - name: Fetch Windows PE bundles (aarch64 + arm64ec) from release
        run: |
          set -e
          # aarch64-windows is not produced by CI (dxmt PE + wine full build are
          # local-only); arm64ec comes partially from the wine artifact. Top up
          # both from the published windows-bundles-v1 release so cube.exe and
          # the full system DLL set are present in the bundle.
          mkdir -p app/Madeira/aarch64-windows app/Madeira/arm64ec-windows bundles
          curl -sSL -o bundles/aarch64.zip \
            https://github.com/duranereloise-hash/MadeiraTV/releases/download/windows-bundles-v1/aarch64-windows.zip
          curl -sSL -o bundles/arm64ec.zip \
            https://github.com/duranereloise-hash/MadeiraTV/releases/download/windows-bundles-v1/arm64ec-windows.zip
          ls -la bundles/
          # zips contain the bundle contents at the archive root
          mkdir -p bundles/aarch64 bundles/arm64ec
          (cd bundles && unzip -o -q aarch64.zip -d aarch64)
          (cd bundles && unzip -o -q arm64ec.zip -d arm64ec)
          ls bundles/aarch64 | head -3
          ls bundles/arm64ec | head -3
          cp -R bundles/aarch64/. app/Madeira/aarch64-windows/ 2>/dev/null || true
          cp -R bundles/arm64ec/. app/Madeira/arm64ec-windows/ 2>/dev/null || true
          echo "aarch64-windows: $(ls app/Madeira/aarch64-windows | wc -l) files"
          echo "arm64ec-windows: $(ls app/Madeira/arm64ec-windows | wc -l) files"
          ls -la app/Madeira/aarch64-windows/cube.exe app/Madeira/arm64ec-windows/cube-x64.exe 2>/dev/null || echo "WARNING: cube exe missing!"
          # Wine prefix template: required for madeira_seed_prefix_if_needed to
          # lay down drive_c with correct layout; without it installs fail with
          # 'permission to save file in folder common'.
          curl -sSL -o app/Madeira/prefix-template.tar.gz \
            https://github.com/duranereloise-hash/MadeiraTV/releases/download/windows-bundles-v1/prefix-template.tar.gz
          ls -la app/Madeira/prefix-template.tar.gz

      - name: Build MadeiraTV.app for tvOS
        run: |
          set -o pipefail
          mkdir -p build
          echo "=== plutil lint ==="
          plutil -lint app/MadeiraTV.xcodeproj/project.pbxproj || true
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project app/MadeiraTV.xcodeproj 2>&1 | head -20 || true
          echo "=== build ==="
          xcodebuild \
            -project app/MadeiraTV.xcodeproj \
            -scheme MadeiraTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/DerivedDataLink \
            build \
            CODE_SIGNING_ALLOWED=NO | tee build/link-tvos.log
          echo "=== rc=${PIPESTATUS[0]} ==="

      - name: Package IPA
        if: always()
        run: |
          APP="build/DerivedDataLink/Build/Products/Debug-appletvos/MadeiraTV.app"
          if [ -d "$APP" ]; then
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            (cd build && zip -qr MadeiraTV.ipa Payload)
            ls -la build/MadeiraTV.ipa
          else
            echo "app not built"
            find build/DerivedDataLink -name "*.app" 2>/dev/null | head
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadeiraTV-ipa-tvos
          path: |
            build/MadeiraTV.ipa
            app/Madeira/*.a
            build/link-tvos.log
          if-no-files-found: warn